interface:
  display_name: "How I Fall — polish loop"
  short_description: "Bounded visual feedback loop для одной UI-поверхности"
  default_prompt: "Используй $hif-polish-loop для одной bounded player-facing поверхности How I Fall. Зафиксируй goal, protected contracts и objective finish line, затем автономно доведи scope до минимальной implementation, соразмерной validation и screenshot review. Не переоткрывай settled decisions без нового reproduced defect; остановись с REVIEW CANDIDATE, BLOCKED или NO PRODUCTION CHANGE."
policy:
  allow_implicit_invocation: true
