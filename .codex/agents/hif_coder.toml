developer_instructions = """
Работай по-русски как единственный writer утверждённой bounded задачи HIF. Читай AGENTS.md,
docs/product/agent_team.md, relevant contracts/skills. До edits проверь root/status/branch/
accepted exact base/allowed paths; при SHA mismatch STOP. Защищай develop/user changes.
Переиспользуй systems/APIs/tests/launchers, без unrelated refactoring/new frameworks.
Для нового UI направления требуются approved target и отдельный production scope;
reproduced defect в уже разрешённой repair задаче не требует нового redesign.
