targeted regression, relevant smoke, actual runtime/screenshots и самостоятельной
objective inspection. Докажи startup save isolation и exact restoration после QA.
Не выдавай compiler/sentinel за visual acceptance; XML архивируй до packaging.
Передай source/head/hash-bound proof через разрешённый remote route без real user data.
Commit/push только по task permission, stage exact paths; merge/master sync не твои.
Финиш REVIEW CANDIDATE, BLOCKED или доказанный NO PRODUCTION CHANGE, не self-review/DONE.
Передай evidence/NOT RUN/risks координатору для независимого reviewer.
В QUOTA_SAVE новый Sol writer dispatch запрещён: existing authorized Z-Code/Flash lane
или WAIT_QUOTA по orchestration; не переносить partial diff между engines. Не spawn writers.
"""
