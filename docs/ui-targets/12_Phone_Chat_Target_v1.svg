<text x="88" y="358" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#a9c0d0">Dialogue Box и Quick Menu</text>
<text x="88" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#a9c0d0">в активном Chat скрыты.</text>
<path d="M88,447 L502,447" fill="none" stroke="#27495d" stroke-width="1"/>
<text x="88" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#68d5f3">ТИХАЯ ИЕРАРХИЯ HIF</text>
<text x="88" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#a9c0d0">Navy-поверхности как в 10/11.</text>
<text x="88" y="569" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#a9c0d0">Cyan — только локальный focus.</text>
<text x="88" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#a9c0d0">Входящие слева, ответ справа.</text>
<text x="88" y="631" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#a9c0d0">Две существующие reply cards.</text>
<text x="88" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#a9c0d0">Нет статусов доставки/прочтения.</text>
<path d="M88,720 L502,720" fill="none" stroke="#27495d" stroke-width="1"/>
<text x="88" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">В кадре: реальный TEST-контент</text>
<text x="88" y="797" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">из test_chat_v1; выбранная рамка</text>
<text x="88" y="828" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">иллюстрирует presentation,</text>
<text x="88" y="859" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">не новый default selection.</text>
<text x="1390" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#68d5f3">TRANSCRIPT / IMAGE</text>
<text x="1390" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Только уже раскрытые записи.</text>
<text x="1390" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">ScrollRect сохраняет прокрутку;</text>
<text x="1390" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">после reveal — к нижнему краю.</text>
<text x="1390" y="358" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Здесь TEST-transcript помещается</text>
<text x="1390" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">целиком; scrollbar не добавлен.</text>
<path d="M1390,449 L1818,449" fill="none" stroke="#27495d" stroke-width="1"/>
<text x="1390" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#68d5f3">ЛОКАЛЬНЫЙ VIEWER</text>
<text x="1390" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Клик по раскрытой Image card.</text>
<text x="1390" y="569" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Aspect-fit без crop / stretch.</text>
<text x="1390" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">X / Escape / scrim закрывают</text>
<text x="1390" y="631" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">только viewer, не активный Chat.</text>
<text x="1390" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Клик по изображению — no-op.</text>
<path d="M1390,720 L1818,720" fill="none" stroke="#27495d" stroke-width="1"/>
<text x="1390" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#68d5f3">ЗАЩИЩЁННЫЙ ВОЗВРАТ</text>
<text x="1390" y="810" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Escape вне viewer — no-op.</text>
<text x="1390" y="841" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Нет Back / отмены Chat.</text>
<text x="1390" y="872" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Completion → cleanup → lease</text>
<text x="1390" y="903" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">release → ровно один returnScene.</text>
<text x="64" y="1032" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#68d5f3">DESIGN ONLY · TECH DEMO ONLY / NOT CANON</text>
<text x="1856" y="1032" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#a9c0d0">Аннотации вне телефона — не runtime UI. Production не изменён.</text>
