<text x="1805" y="686" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#edf4fa">X</text>
<text x="1031" y="683" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#a9c0d0">scrim</text>
<text x="1593" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#a9c0d0">aspect-fit</text>
<text x="1014" y="910" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">X / Escape / scrim → тот же Chat; image click не закрывает.</text>
<text x="1014" y="941" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Таймеры локально на паузе; underlying UI input заблокирован.</text>
<text x="1014" y="972" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#a9c0d0">Transcript / reply / GameState неизменны; без повторного audio.</text>
<text x="60" y="1033" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#68d5f3">ESCAPE ВНЕ VIEWER — NO-OP · НЕТ BACK / ОТМЕНЫ CHAT</text>
<text x="1860" y="1033" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#a9c0d0">DESIGN ONLY · TECH DEMO ONLY / NOT CANON</text>
