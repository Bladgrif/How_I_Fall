name: Unity Activation

on:
  push:
    branches:
      - codex/unity-activation-temp-20260909

jobs:
  credentials-only-diagnostic:
    name: Unity Personal credentials-only diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout accepted product SHA
        uses: actions/checkout@v4
        with:
          ref: 68916d49a2be5a4fc4253f869d64b87c6ae5dbef
          fetch-depth: 1

      - name: Run Unity EditMode diagnostic
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          cliVersion: v0.1.53
          testMode: editmode
          artifactsPath: artifacts
